<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #eef3f9; color: #222; }
        a { text-decoration: none; color: inherit; }

        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100vh; background: #003366; color: white; overflow-y: auto; }
        .sidebar .logo { text-align: center; padding: 25px 15px; border-bottom: 1px solid rgba(255,255,255,.15); }
        .sidebar .logo img { width: 70px; margin-bottom: 12px; }
        .sidebar .logo h2 { color: white; font-size: 20px; }
        .sidebar ul { list-style: none; padding: 20px 0; }
        .sidebar ul li { margin: 8px 15px; }
        .sidebar ul li a { display: block; color: white; padding: 12px 18px; border-radius: 8px; font-size: 15px; transition: .3s; }
        .sidebar ul li a:hover, .sidebar ul li a.active { background: #f5b400; color: #003366; font-weight: bold; }

        .main { margin-left: 260px; padding: 30px; min-height: 100vh; }
        .topbar { background: #fff; padding: 20px 30px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); margin-bottom: 25px; }
        .topbar h1 { color: #003366; margin: 0; }

        form { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); max-width: 700px; }
        label { display: block; margin-top: 15px; margin-bottom: 6px; font-weight: 500; color: #003366; }
        input { width: 100%; padding: 12px; border: 1px solid #d9e2ec; border-radius: 6px; font-size: 15px; outline: none; }
        input:focus { border-color: #00509d; }

        button { background: #f5b400; color: #003366; border: none; padding: 14px 28px; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: .3s; }
        button:hover { background: #003366; color: white; }

        @media (max-width: 768px) { .sidebar { position: relative; width: 100%; height: auto; } .main { margin-left: 0; padding: 20px; } }
    </style>
</head>

<body>

<div class="sidebar">
    <div class="logo">
        <img src="../images/logo.png" alt="Logo">
        <h2>Student Portal</h2>
    </div>
    <ul>
        <li><a href="dashboard.html">🏠 Dashboard</a></li>
        <li><a href="attendance.html">📋 Attendance</a></li>
        <li><a href="timetable.html">📅 Timetable</a></li>
        <li><a href="fees.html">💳 Fees</a></li>
        <li><a href="subject-information.html">📚 Subjects</a></li>
        <li><a href="leave-application.html">📝 Leave</a></li>
        <li><a href="event-entry.html">🎉 Events</a></li>
        <li><a href="calendar.html">📆 Calendar</a></li>
        <li><a href="address.html">📍 Address</a></li>
        <li><a href="settings.html" class="active">⚙ Settings</a></li>
        <li><a href="logout.html">🚪 Logout</a></li>
    </ul>
</div>

<div class="main">
    <div class="topbar">
        <h1>Account Settings</h1>
    </div>

    <form onsubmit="event.preventDefault(); alert('Account settings saved successfully!');">
        <label>Full Name</label>
        <input type="text" value="John Doe" required>

        <label>Email Address</label>
        <input type="email" value="john@example.com" required>

        <label>Mobile Number</label>
        <input type="tel" value="+91 9876543210" required>

        <label>Change Password</label>
        <input type="password" placeholder="Enter New Password">

        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm Password">

        <button type="submit">Save Changes</button>
    </form>
</div>

</body>
</html>
