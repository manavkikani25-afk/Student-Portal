</head>

<body>

<div class="sidebar">
    <div class="logo">
        <img src="../images/logo.png" alt="Logo">
        <h2>Student Portal</h2>
    </div>
    <ul>
        <li><a href="dashboard.html">🏠 Dashboard</a></li>
        <li><a href="attendance.html">📋 Attendance</a></li>
        <li><a href="timetable.html">📅 Timetable</a></li>

        <li><a href="leave-application.html" class="active">📝 Leave</a></li>

    </ul>
</div>

<div class="main">
    <div class="topbar">
        <h1>Leave Application</h1>
    </div>

    <div class="leave-container">
        <h2>Apply for Leave</h2>
        <form onsubmit="event.preventDefault(); alert('Leave application submitted successfully!');">
            <label>Student Name</label>
            <input type="text" value="John Doe" readonly>

            <label>Enrollment Number</label>
            <input type="text" value="23CS001" readonly>

            <label>Leave Type</label>
            <select required>
                <option>Medical Leave</option>
                <option>Personal Leave</option>
                <option>Emergency Leave</option>
                <option>Sports Leave</option>
            </select>

            <label>From Date</label>
            <input type="date" required>

            <label>To Date</label>
            <input type="date" required>

            <label>Reason</label>
            <textarea rows="5" placeholder="Enter reason for leave..." required></textarea>

            <button type="submit">Submit Application</button>
        </form>
    </div>
</div>

</body>
</html>
